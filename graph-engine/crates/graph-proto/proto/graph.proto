syntax = "proto3";

package graph.v1;

// Client-facing API (spec §8.2). Transport: gRPC (§8.1 — chosen for native
// streaming and Protobuf typing consistent with the statically-typed
// model). No AuthN/AuthZ in this surface — deliberately out of v1 scope
// (spec §8.3).
service GraphService {
  // Executes a DSL query (spec §7.1) and streams results back as they are
  // produced by the coordinator's scatter-gather loop (§7.5) — never
  // materialized in full before the first result is sent.
  rpc ExecuteQuery(ExecuteQueryRequest) returns (stream QueryResult);

  // Returns the schema version currently active (§3.5).
  rpc GetSchema(GetSchemaRequest) returns (SchemaResponse);

  // Metadata about the index generation currently served: pinned
  // snapshot, last rebuild time, node/edge counts (§5.3, §9.1 staleness
  // metric).
  rpc GetIndexStatus(GetIndexStatusRequest) returns (IndexStatusResponse);

  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// Internal, coordinator -> partition-replica surface driving one hop of a
// scatter-gather round (spec §7.4). Not exposed to end clients.
service PartitionService {
  rpc ResolveStart(ResolveStartRequest) returns (stream Binding);
  // *(least-privilege-via-telemetry use case)* Start-node resolution
  // with no equality filter at all — "every node of this label", e.g.
  // `MATCH (w:Workload)` with no `{...}` — a full local scan rather than
  // a property-index lookup. A separate RPC (not `ResolveStart` with an
  // empty key) because the two have genuinely different execution paths
  // on the partition side (`PropertyIndex::lookup_eq` vs. iterating
  // `node_records`), not just a different wire shape.
  rpc ResolveAll(ResolveAllRequest) returns (stream Binding);
  rpc ExpandHop(ExpandHopRequest) returns (stream Binding);
  // *(least-privilege-via-telemetry use case)* The correlated
  // `NOT EXISTS { MATCH (from)-[edge:TYPE]->(to) WHERE ... }` anti-join
  // (`graph-dsl`'s `ExistsSubquery`, scoped to a single hop between two
  // already-bound nodes — see that type's doc comment). Evaluated
  // locally by whichever partition owns `from_alias`'s node, since an
  // edge's record is owned by its source's partition (`graph-index`'s
  // `edge_records`, same rule `ExpandHop`'s adjacency already follows).
  // `conditions` are always fully resolved literals by the time they
  // reach here — any condition that referenced an *outer* bound edge
  // alias (`a.action = g.action`) is resolved to a concrete value by
  // the coordinator (via `GetEdgeProperties` on `g`) before this call,
  // so a partition never needs to reach across to another partition
  // just to evaluate one anti-join.
  rpc CheckAntiJoin(CheckAntiJoinRequest) returns (CheckAntiJoinResponse);
  // Reuses GraphService's message types — the coordinator's own
  // GetIndexStatus (CO3) just relays this partition's GenerationMeta
  // verbatim, mono-partition v1 having exactly one to relay.
  rpc GetIndexStatus(GetIndexStatusRequest) returns (IndexStatusResponse);
  // Point lookup of full node property records by id, used by the
  // coordinator to hydrate `QueryResult.properties` after a traversal
  // has resolved which `NodeId`s matched — the traversal itself never
  // needs anything but ids, so this stays a separate RPC rather than
  // being folded into ResolveStart/ExpandHop.
  rpc GetNodeProperties(GetNodePropertiesRequest) returns (GetNodePropertiesResponse);
  // Edge-alias counterpart of `GetNodeProperties` (least-privilege
  // use case's `g.action`) — same point-lookup-by-id shape, against
  // `graph-index`'s `edge_records` instead of `node_records`.
  rpc GetEdgeProperties(GetEdgePropertiesRequest) returns (GetEdgePropertiesResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

message ExecuteQueryRequest {
  string dsl = 1;
}

message QueryResult {
  // NodeId per alias, bit-cast into int64_value — kept for callers that
  // only need identity (e.g. joining across multiple queries). Edge
  // aliases are not represented here (an EdgeId is meaningless to a
  // caller on its own) — only in `edge_properties` below.
  map<string, Value> projection = 1;
  // The actual property record backing each *node* alias in
  // `projection`, hydrated via GetNodeProperties — what a human-facing
  // client (like the viewer) renders instead of a bare internal id.
  map<string, NodeProperties> properties = 2;
  // The property record backing each *edge* alias RETURN'd or
  // referenced by the query (least-privilege use case's `g.action`),
  // hydrated via GetEdgeProperties. Keyed by the edge alias, same as
  // `properties` is keyed by node alias.
  map<string, EdgeProperties> edge_properties = 3;
}

message GetNodePropertiesRequest {
  repeated uint64 node_ids = 1;
}

message GetNodePropertiesResponse {
  map<uint64, NodeProperties> properties = 1;
}

message NodeProperties {
  string label = 1;
  map<string, Value> fields = 2;
}

message GetEdgePropertiesRequest {
  repeated uint64 edge_ids = 1;
}

message GetEdgePropertiesResponse {
  map<uint64, EdgeProperties> properties = 1;
}

message EdgeProperties {
  string edge_type = 1;
  map<string, Value> fields = 2;
}

message Value {
  oneof kind {
    int64 int64_value = 1;
    double float64_value = 2;
    bool bool_value = 3;
    string string_value = 4;
    int64 timestamp_value = 5;
    bytes bytes_value = 6;
  }
}

message GetSchemaRequest {}

message SchemaResponse {
  string schema_idl = 1;
  string version = 2;
}

message GetIndexStatusRequest {}

message IndexStatusResponse {
  // One pinned snapshot per Iceberg table (§4.2), keyed by table name -
  // a single scalar can't represent this: a rebuild pins a snapshot per
  // table it scans, not one for the whole generation.
  map<string, int64> pinned_snapshot_by_table = 1;
  int64 last_rebuilt_unix_ms = 2;
  uint64 node_count = 3;
  uint64 edge_count = 4;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  enum Status {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
  }
  Status status = 1;
}

message ResolveStartRequest {
  // Alias to bind each resolved node under, e.g. "p" in
  // `MATCH (p:Person {name: "Alice"})` — carried explicitly since the
  // response only contains `Binding`s, not the request that produced
  // them.
  string alias = 1;
  string label_or_type = 2;
  string property = 3;
  Value key = 4;
}

message ResolveAllRequest {
  string alias = 1;
  string label = 2;
}

message ExpandHopRequest {
  repeated Binding frontier = 1;
  string from_alias = 2;
  string to_alias = 3;
  // Empty = the pattern left the destination node unlabeled, in which
  // case `filters` is necessarily empty too — see
  // `graph_query::PlanStep::ExpandHop`'s doc comment for why.
  string to_label = 4;
  // Empty = untyped edge (`-->`, no `[:TYPE]`).
  string edge_type = 5;
  bool incoming = 6;
  uint32 hop_min = 7;
  uint32 hop_max = 8;
  repeated PropertyFilter filters = 9;
  // Empty = the pattern left this hop's edge unaliased. Non-empty only
  // ever appears together with hop_min == hop_max == 1 — the planner
  // (task Q-edge-alias) never emits an aliased multi-hop step, and the
  // validator (D7-D9) rejects one at parse time (see `dsl.pest`'s
  // `edge_detail` doc comment for why).
  string edge_alias = 10;
}

message PropertyFilter {
  string property = 1;
  ComparisonOp op = 2;
  Value value = 3;
}

enum ComparisonOp {
  EQ = 0;
  NE = 1;
  LT = 2;
  LTE = 3;
  GT = 4;
  GTE = 5;
}

message Binding {
  map<string, uint64> node_ids_by_alias = 1;
  // Populated only for aliases bound by an aliased single-hop edge
  // (`[g:GRANTS]`) — most bindings carry no entries here at all.
  map<string, uint64> edge_ids_by_alias = 2;
}

message CheckAntiJoinRequest {
  repeated Binding frontier = 1;
  // Both already bound node aliases from the outer pattern — see
  // `graph_dsl::ExistsSubquery`'s doc comment for the "re-anchor, don't
  // introduce" scoping this assumes.
  string from_alias = 2;
  string to_alias = 3;
  // Empty = the NOT EXISTS clause's edge is unaliased.
  string edge_alias = 4;
  string edge_type = 5;
  bool incoming = 6;
  // AND-combined, evaluated against the *candidate* (inner) edge found
  // between from_alias's and to_alias's bound nodes — every operand
  // already resolved to a literal by the coordinator (see this RPC's
  // doc comment on `PartitionService`).
  repeated PropertyFilter conditions = 7;
}

message CheckAntiJoinResponse {
  // Indices into the request's `frontier` for bindings where NOT EXISTS
  // holds (no candidate edge satisfied every condition) — i.e. the
  // survivors, ready to flow into the next plan step exactly like an
  // ExpandHop response's bindings would.
  repeated uint32 surviving_indices = 1;
}
